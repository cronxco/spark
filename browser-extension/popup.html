<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Save to Spark</title>
        <link rel="stylesheet" href="styles.css">
    </head>
    <body class="popup">
        <main>
            <div class="brand">
                <span class="spark" aria-hidden="true">✦</span>
                <div>
                    <h1>Save to Spark</h1>
                    <p>Capture the page exactly as your browser can read it.</p>
                </div>
            </div>

            <button id="capture" type="button">Capture this page</button>
            <p id="status" class="status" role="status" aria-live="polite"></p>
            <button id="settings" class="link-button" type="button">Extension settings</button>
        </main>

        <script src="popup.js"></script>
    </body>
</html>
