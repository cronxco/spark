openapi: 3.1.0
info:
  title: Spark Mobile API
  version: "1.0.0"
  description: >
    The iOS companion app's REST adapter. Hand-written from routes/mobile.php
    and the underlying controllers on branch feature/api-mobile-mcp-parity —
    not generated, so keep it updated alongside docs/API/mobile_API.md when
    routes change. Gated behind config('ios.mobile_api_enabled'); see
    docs/API/README.md for the cross-surface capability model.
externalDocs:
  description: Full prose reference
  url: ../mobile_API.md
servers:
  - url: /api/v1/mobile
security:
  - sparkToken: []
tags:
  - name: profile
  - name: feed
  - name: entities
  - name: metrics
  - name: widgets
  - name: search
  - name: tags
  - name: integrations
  - name: places
  - name: sync
  - name: devices
  - name: health
  - name: live-activities
  - name: check-ins
  - name: notifications
  - name: flint
  - name: money
  - name: up-to-speed
  - name: settings

paths:
  /ping:
    get:
      operationId: ping
      tags: [profile]
      summary: Health check for the full middleware stack
      responses:
        "200": { description: OK }

  /me:
    get:
      operationId: me
      tags: [profile]
      summary: Authenticated user profile
      responses:
        "200":
          description: OK
          headers:
            ETag:
              description: >-
                Strong user version. Echo as If-Match on routes guarded by
                if-match:user, currently PATCH /settings/notifications.
              schema: { type: string }
          content:
            {
              application/json:
                { schema: { $ref: "#/components/schemas/UserProfile" } },
            }

  /logout:
    post:
      operationId: logout
      tags: [profile]
      summary: End the calling session server-side
      description: >-
        Revokes the paired OAuth refresh token and deletes the access token
        presenting the request. Requires only ios:read so a read-only session
        can sign itself out, and carries no If-Match. Scoped to the current
        credential: other devices and separately created personal access
        tokens are untouched.
      responses:
        "204":
          {
            description: "No content. The bearer token used for this request is now invalid.",
          }

  /briefing/today:
    get:
      operationId: briefingToday
      tags: [feed]
      summary: Daily summary across all domains
      description: >-
        sync_status carries a stale/as_of freshness judgement per connected
        service, including services with nothing to report for the day.
        sections.money splits total_spend from internal_transfers and
        total_in and carries total_spend_vs_baseline_pct. See mobile_API.md
        for the full response shape.
      parameters:
        - { name: date, in: query, schema: { type: string, default: today } }
        - {
            name: domains,
            in: query,
            schema: { type: string },
            description: "Comma-separated domain filter",
          }
      responses:
        "200": { description: OK }

  /health/dashboard:
    get:
      operationId: healthDashboard
      tags: [health]
      summary: Curated fitness-first health dashboard
      parameters:
        - { name: date, in: query, schema: { type: string, default: today } }
        - {
            name: range,
            in: query,
            schema: { type: string, enum: ["7d", "30d", "90d"], default: "7d" },
          }
      responses:
        "200": { description: OK }
        "422": { $ref: "#/components/responses/ValidationError" }

  /feed:
    get:
      operationId: feed
      tags: [feed]
      summary: Cursor-paginated reverse-chronological event feed
      parameters:
        - { name: cursor, in: query, schema: { type: string } }
        - {
            name: limit,
            in: query,
            schema: { type: integer, maximum: 100, default: 20 },
          }
        - { name: domain, in: query, schema: { type: string } }
        - { name: date, in: query, schema: { type: string, format: date } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    {
                      type: array,
                      items: { $ref: "#/components/schemas/CompactEvent" },
                    }
                  next_cursor: { type: [string, "null"] }
                  has_more: { type: boolean }
        "422": { $ref: "#/components/responses/ValidationError" }

  /events/filter:
    get:
      operationId: filterEvents
      tags: [feed]
      summary: Exact service/action/date-range event filtering
      parameters:
        - {
            name: service,
            in: query,
            required: true,
            schema: { type: string, maxLength: 100 },
          }
        - { name: action, in: query, schema: { type: string, maxLength: 255 } }
        - { name: from_date, in: query, schema: { type: string } }
        - { name: to_date, in: query, schema: { type: string } }
        - {
            name: limit,
            in: query,
            schema: { type: integer, maximum: 100, default: 50 },
          }
      responses:
        "200": { description: OK }

  /context/day:
    get:
      operationId: contextDay
      tags: [feed]
      summary: Full raw day context (events, metrics, relationships)
      deprecated: true
      description: >-
        Deprecated: superseded by /briefing/today's sections. No mobile
        client calls this. Responses carry Deprecation: true, Sunset, and a
        Link header to the successor.
      parameters:
        - { name: date, in: query, schema: { type: string, format: date } }
        - {
            name: domains,
            in: query,
            schema: { type: array, items: { type: string }, maxItems: 10 },
          }
      responses:
        "200": { description: OK }

  /context/service-status:
    get:
      operationId: contextServiceStatus
      tags: [feed]
      summary: Sync coverage/freshness per service for a date
      deprecated: true
      description: >-
        Deprecated: superseded by /briefing/today's sync_status, which now
        carries the same stale/as_of judgement. No mobile client calls this.
        Same Deprecation/Sunset/Link headers as /context/day.
      parameters:
        - { name: date, in: query, schema: { type: string, format: date } }
      responses:
        "200": { description: OK }

  /notifications:
    get:
      operationId: listNotifications
      tags: [notifications]
      summary: Cursor-paginated notifications inbox
      parameters:
        - { name: cursor, in: query, schema: { type: string } }
        - {
            name: limit,
            in: query,
            schema: { type: integer, maximum: 200, default: 50 },
          }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    {
                      type: array,
                      items:
                        { $ref: "#/components/schemas/CompactNotification" },
                    }
                  next_cursor: { type: [string, "null"] }
                  has_more: { type: boolean }

  /notifications/read-all:
    post:
      operationId: markAllNotificationsRead
      tags: [notifications]
      summary: Mark all notifications as read
      description: >-
        Idempotent, so no If-Match precondition. The 204 carries the user's
        refreshed ETag.
      responses:
        "204":
          description: No content
          headers:
            ETag:
              description: Refreshed strong user version.
              schema: { type: string }

  /notifications/{id}/read:
    post:
      operationId: markNotificationRead
      tags: [notifications]
      summary: Mark one notification as read
      description: >-
        Idempotent, so no If-Match precondition. The 204 carries the
        notification's refreshed ETag.
      parameters:
        - { $ref: "#/components/parameters/NumericId" }
      responses:
        "204":
          description: No content
          headers:
            ETag:
              description: Refreshed strong notification version.
              schema: { type: string }
        "404": { $ref: "#/components/responses/NotFound" }

  /notifications/{id}:
    delete:
      operationId: deleteNotification
      tags: [notifications]
      summary: Delete one notification
      parameters:
        - { $ref: "#/components/parameters/NumericId" }
        - { $ref: "#/components/parameters/IfMatch" }
      responses:
        "204": { description: No content }
        "404": { $ref: "#/components/responses/NotFound" }

  /events/{id}:
    get:
      operationId: getEvent
      tags: [entities]
      summary: Single event with full embedded blocks
      parameters: [{ $ref: "#/components/parameters/EntityId" }]
      responses:
        "200":
          {
            description: OK,
            content:
              {
                application/json:
                  { schema: { $ref: "#/components/schemas/CompactEvent" } },
              },
          }
        "404": { $ref: "#/components/responses/NotFound" }

  /events/{id}/note:
    patch:
      operationId: updateEventNote
      tags: [entities]
      summary: Set or clear an event's note
      parameters:
        [
          { $ref: "#/components/parameters/EntityId" },
          { $ref: "#/components/parameters/IfMatch" },
        ]
      requestBody:
        content:
          application/json:
            schema:
              { type: object, properties: { note: { type: [string, "null"] } } }
      responses:
        "200": { description: OK }
        "428": { $ref: "#/components/responses/PreconditionRequired" }
        "412": { $ref: "#/components/responses/PreconditionFailed" }

  /objects/{id}:
    get:
      operationId: getObject
      tags: [entities]
      summary: Single object, optionally with recent events
      parameters:
        - { $ref: "#/components/parameters/EntityId" }
        - {
            name: include_events,
            in: query,
            schema: { type: boolean, default: true },
          }
        - {
            name: event_limit,
            in: query,
            schema: { type: integer, minimum: 1, maximum: 25, default: 5 },
          }
      responses:
        "200":
          {
            description: OK,
            content:
              {
                application/json:
                  { schema: { $ref: "#/components/schemas/CompactObject" } },
              },
          }
        "404": { $ref: "#/components/responses/NotFound" }

  /blocks/{id}:
    get:
      operationId: getBlock
      tags: [entities]
      summary: Single block
      parameters: [{ $ref: "#/components/parameters/EntityId" }]
      responses:
        "200":
          {
            description: OK,
            content:
              {
                application/json:
                  { schema: { $ref: "#/components/schemas/CompactBlock" } },
              },
          }
        "404": { $ref: "#/components/responses/NotFound" }

  /{kind}/{id}:
    patch:
      operationId: updateEntity
      tags: [entities]
      summary: Non-destructive update of an owned event, object, or block
      parameters:
        - { $ref: "#/components/parameters/EntityKind" }
        - { $ref: "#/components/parameters/EntityId" }
        - { $ref: "#/components/parameters/IfMatch" }
      requestBody:
        content:
          application/json:
            schema:
              {
                type: object,
                description: "Allow-listed fields per kind — see MCP.md#update-entity",
              }
      responses:
        "200": { description: OK }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "428": { $ref: "#/components/responses/PreconditionRequired" }
        "412": { $ref: "#/components/responses/PreconditionFailed" }

  /{kind}/{id}/location:
    patch:
      operationId: setLocation
      tags: [entities]
      summary: Set a location on an owned event or object (mobile-only)
      parameters:
        - {
            name: kind,
            in: path,
            required: true,
            schema: { type: string, enum: [events, objects] },
          }
        - { $ref: "#/components/parameters/EntityId" }
        - { $ref: "#/components/parameters/IfMatch" }
      requestBody:
        content:
          application/json:
            schema:
              {
                type: object,
                required: [latitude, longitude],
                properties:
                  {
                    latitude: { type: number, minimum: -90, maximum: 90 },
                    longitude: { type: number, minimum: -180, maximum: 180 },
                    address: { type: string, maxLength: 500 },
                  },
              }
      responses:
        "200": { description: OK }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      operationId: clearLocation
      tags: [entities]
      summary: Clear a location from an owned event or object
      parameters:
        - {
            name: kind,
            in: path,
            required: true,
            schema: { type: string, enum: [events, objects] },
          }
        - { $ref: "#/components/parameters/EntityId" }
        - { $ref: "#/components/parameters/IfMatch" }
      responses:
        "200": { description: OK }
        "404": { $ref: "#/components/responses/NotFound" }

  /{kind}/{id}/location/geocode:
    post:
      operationId: geocodeLocation
      tags: [entities]
      summary: Geocode an address and set it as the entity's location
      parameters:
        - {
            name: kind,
            in: path,
            required: true,
            schema: { type: string, enum: [events, objects] },
          }
        - { $ref: "#/components/parameters/EntityId" }
        - { $ref: "#/components/parameters/IfMatch" }
      requestBody:
        content:
          application/json:
            schema:
              {
                type: object,
                required: [address],
                properties: { address: { type: string, maxLength: 500 } },
              }
      responses:
        "200": { description: OK }
        "422":
          { description: Entity not found or address could not be geocoded }

  /{kind}/{id}/relationships:
    get:
      operationId: listRelationships
      tags: [entities]
      summary: List relationships attached to an owned entity
      parameters:
        [
          { $ref: "#/components/parameters/EntityKind" },
          { $ref: "#/components/parameters/EntityId" },
        ]
      responses:
        "200": { description: OK }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      operationId: createRelationship
      tags: [entities]
      summary: Create a relationship from an owned entity
      parameters:
        [
          { $ref: "#/components/parameters/EntityKind" },
          { $ref: "#/components/parameters/EntityId" },
          { $ref: "#/components/parameters/IfMatch" },
        ]
      requestBody:
        content:
          application/json:
            schema:
              {
                type: object,
                required: [to_kind, to_id, type],
                properties:
                  {
                    to_kind: { type: string },
                    to_id: { type: string, format: uuid },
                    type: { type: string },
                    value: { type: [number, "null"] },
                    value_multiplier: { type: [number, "null"] },
                    value_unit: { type: [string, "null"] },
                    metadata: { type: object },
                  },
              }
      responses:
        "201": { description: Created }
        "422": { $ref: "#/components/responses/ValidationError" }

  /relationships/{relationship}:
    delete:
      operationId: deleteRelationship
      tags: [entities]
      summary: Delete an owned relationship
      parameters:
        - {
            name: relationship,
            in: path,
            required: true,
            schema: { type: string, format: uuid },
          }
        - { $ref: "#/components/parameters/IfMatch" }
      responses:
        "204": { description: No content }
        "404": { $ref: "#/components/responses/NotFound" }

  /metrics:
    get:
      operationId: listMetrics
      tags: [metrics]
      summary: All metric identifiers and metadata
      responses:
        "200":
          {
            description: OK,
            content:
              {
                application/json:
                  {
                    schema:
                      {
                        type: array,
                        items: { $ref: "#/components/schemas/CompactMetric" },
                      },
                  },
              },
          }

  /metrics/baselines:
    get:
      operationId: metricBaselines
      tags: [metrics]
      summary: Baseline statistics for every computed metric
      responses:
        "200": { description: OK }

  /metrics/{metric}:
    get:
      operationId: getMetricTrend
      tags: [metrics]
      summary: Metric trend with daily values and baseline
      parameters:
        - { name: metric, in: path, required: true, schema: { type: string } }
        - {
            name: range,
            in: query,
            schema: { type: string, enum: ["7d", "30d", "90d", "1y"] },
          }
        - { name: from, in: query, schema: { type: string } }
        - { name: to, in: query, schema: { type: string } }
      responses:
        "200": { description: OK }
        "404": { $ref: "#/components/responses/NotFound" }

  /widgets/today:
    get:
      operationId: widgetsToday
      tags: [widgets]
      summary: Compact today widget payload (≤4 KB)
      responses:
        "200": { description: OK }

  /widgets/metrics/{metric}:
    get:
      operationId: widgetsMetric
      tags: [widgets]
      summary: Sparkline widget for a single metric
      parameters:
        - { name: metric, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: OK }

  /widgets/spend:
    get:
      operationId: widgetsSpend
      tags: [widgets]
      summary: Today's spend widget
      responses:
        "200": { description: OK }

  /search:
    get:
      operationId: search
      tags: [search]
      summary: Multi-mode search across events, objects, integrations, metrics
      parameters:
        - { name: q, in: query, schema: { type: string } }
        - {
            name: mode,
            in: query,
            schema:
              {
                type: string,
                enum: [default, semantic, tag, metric, integration],
                default: default,
              },
          }
        - { name: limit, in: query, schema: { type: integer, default: 10 } }
      responses:
        "200": { description: OK }
        "422": { $ref: "#/components/responses/ValidationError" }

  /search/{type}:
    get:
      operationId: typedSearch
      tags: [search]
      summary: Typed semantic/keyword search scoped to one entity kind
      parameters:
        - {
            name: type,
            in: path,
            required: true,
            schema: { type: string, enum: [events, objects, blocks] },
          }
        - {
            name: query,
            in: query,
            required: true,
            schema: { type: string, maxLength: 500 },
          }
        - {
            name: semantic,
            in: query,
            schema: { type: boolean, default: true },
          }
        - {
            name: limit,
            in: query,
            schema: { type: integer, minimum: 1, maximum: 50, default: 20 },
          }
        - { name: service, in: query, schema: { type: string, maxLength: 100 } }
        - { name: domain, in: query, schema: { type: string, maxLength: 100 } }
        - { name: concept, in: query, schema: { type: string, maxLength: 100 } }
        - {
            name: object_type,
            in: query,
            schema: { type: string, maxLength: 100 },
          }
        - {
            name: block_type,
            in: query,
            schema: { type: string, maxLength: 100 },
          }
        - { name: from_date, in: query, schema: { type: string, format: date } }
        - { name: to_date, in: query, schema: { type: string, format: date } }
      responses:
        "200": { description: OK }

  /tags:
    get:
      operationId: listTags
      tags: [tags]
      summary: Cursor-paginated list of the user's tags
      parameters:
        - { name: q, in: query, schema: { type: string, maxLength: 255 } }
        - { name: cursor, in: query, schema: { type: string } }
        - {
            name: limit,
            in: query,
            schema: { type: integer, maximum: 100, default: 30 },
          }
      responses:
        "200": { description: OK }

  /tags/suggest:
    get:
      operationId: suggestTags
      tags: [tags]
      summary: Autocomplete tag suggestions
      parameters:
        - { name: q, in: query, schema: { type: string } }
        - {
            name: limit,
            in: query,
            schema: { type: integer, maximum: 25, default: 10 },
          }
      responses:
        "200": { description: OK }

  /tags/{id}:
    get:
      operationId: getTag
      tags: [tags]
      summary: A single tag plus the items tagged with it
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
        - { name: cursor, in: query, schema: { type: string } }
        - {
            name: limit,
            in: query,
            schema: { type: integer, maximum: 100, default: 30 },
          }
      responses:
        "200": { description: OK }
        "404": { $ref: "#/components/responses/NotFound" }

  /events/{id}/tags:
    post:
      operationId: attachEventTag
      tags: [tags]
      summary: Attach a tag to an owned event
      parameters:
        [
          { $ref: "#/components/parameters/EntityId" },
          { $ref: "#/components/parameters/IfMatch" },
          { $ref: "#/components/parameters/IdempotencyKeyOptional" },
        ]
      requestBody:
        content:
          application/json:
            schema:
              {
                type: object,
                properties:
                  {
                    tag_id: { type: integer },
                    name: { type: string },
                    type: { type: string },
                  },
              }
      responses:
        "201": { description: Created }
        "422": { $ref: "#/components/responses/ValidationError" }

  /events/{id}/tags/{tagId}:
    delete:
      operationId: detachEventTag
      tags: [tags]
      summary: Detach a tag from an owned event
      parameters:
        - { $ref: "#/components/parameters/EntityId" }
        - { name: tagId, in: path, required: true, schema: { type: integer } }
        - { $ref: "#/components/parameters/IfMatch" }
      responses:
        "200": { description: OK }
        "404": { $ref: "#/components/responses/NotFound" }

  /objects/{id}/tags:
    post:
      operationId: attachObjectTag
      tags: [tags]
      summary: Attach a tag to an owned object
      parameters:
        [
          { $ref: "#/components/parameters/EntityId" },
          { $ref: "#/components/parameters/IfMatch" },
          { $ref: "#/components/parameters/IdempotencyKeyOptional" },
        ]
      requestBody:
        content:
          application/json:
            schema:
              {
                type: object,
                properties:
                  {
                    tag_id: { type: integer },
                    name: { type: string },
                    type: { type: string },
                  },
              }
      responses:
        "201": { description: Created }
        "422": { $ref: "#/components/responses/ValidationError" }

  /objects/{id}/tags/{tagId}:
    delete:
      operationId: detachObjectTag
      tags: [tags]
      summary: Detach a tag from an owned object
      parameters:
        - { $ref: "#/components/parameters/EntityId" }
        - { name: tagId, in: path, required: true, schema: { type: integer } }
        - { $ref: "#/components/parameters/IfMatch" }
      responses:
        "200": { description: OK }
        "404": { $ref: "#/components/responses/NotFound" }

  /integrations:
    get:
      operationId: listIntegrations
      tags: [integrations]
      summary: All of the user's integrations
      responses:
        "200":
          {
            description: OK,
            content:
              {
                application/json:
                  {
                    schema:
                      {
                        type: object,
                        properties:
                          {
                            data:
                              {
                                type: array,
                                items:
                                  {
                                    $ref: "#/components/schemas/CompactIntegration",
                                  },
                              },
                          },
                      },
                  },
              },
          }

  /integrations/{id}:
    get:
      operationId: getIntegration
      tags: [integrations]
      summary: A single integration
      parameters: [{ $ref: "#/components/parameters/EntityId" }]
      responses:
        "200":
          {
            description: OK,
            content:
              {
                application/json:
                  {
                    schema: { $ref: "#/components/schemas/CompactIntegration" },
                  },
              },
          }
        "404": { $ref: "#/components/responses/NotFound" }

  /integrations/{id}/sync:
    post:
      operationId: syncIntegration
      tags: [integrations]
      summary: Trigger an immediate fetch for one integration instance
      parameters:
        [
          { $ref: "#/components/parameters/EntityId" },
          { $ref: "#/components/parameters/IfMatch" },
        ]
      responses:
        "200": { description: OK }
        "422": { description: Integration is paused }

  /integrations/sync:
    post:
      operationId: syncIntegrationsByService
      tags: [integrations]
      summary: Trigger an immediate fetch for every non-paused instance of a service
      requestBody:
        content:
          application/json:
            schema:
              {
                type: object,
                required: [service],
                properties: { service: { type: string, maxLength: 100 } },
              }
      responses:
        "200": { description: OK }
        "404": { description: No integrations found for that service }

  /integrations/{id}/oauth/start:
    post:
      operationId: startIntegrationOauth
      tags: [integrations]
      summary: Start a PKCE re-authentication flow (mobile-only)
      parameters: [{ $ref: "#/components/parameters/EntityId" }]
      responses:
        "200": { description: OK }
        "422":
          { description: "Not connected, unknown service, or non-OAuth plugin" }

  /places/{id}:
    get:
      operationId: getPlace
      tags: [places]
      summary: A single place
      parameters: [{ $ref: "#/components/parameters/EntityId" }]
      responses:
        "200":
          {
            description: OK,
            content:
              {
                application/json:
                  { schema: { $ref: "#/components/schemas/CompactPlace" } },
              },
          }
        "404": { $ref: "#/components/responses/NotFound" }

  /map/data:
    get:
      operationId: mapData
      tags: [places]
      summary: Geo-located events and places within a bounding box
      parameters:
        - {
            name: bbox,
            in: query,
            required: true,
            schema: { type: string },
            description: "swLat,swLng,neLat,neLng",
          }
      responses:
        "200": { description: OK }
        "422": { $ref: "#/components/responses/ValidationError" }

  /sync/delta:
    get:
      operationId: syncDelta
      tags: [sync]
      summary: Events created/updated/deleted since a cursor (up to 200 per call)
      parameters:
        - { name: since, in: query, schema: { type: string } }
      responses:
        "200": { description: OK }

  /devices:
    get:
      operationId: listDevices
      tags: [devices]
      summary: List registered push subscriptions
      responses:
        "200": { description: OK }
    post:
      operationId: registerDevice
      tags: [devices]
      summary: Register or update an APNs device token (mobile-only)
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
                [
                  apns_token,
                  app_environment,
                  bundle_id,
                  app_version,
                  os_version,
                ]
              properties:
                apns_token: { type: string, minLength: 64, maxLength: 64 }
                app_environment: { type: string, enum: [sandbox, production] }
                bundle_id: { type: string, maxLength: 100 }
                app_version: { type: string, maxLength: 30 }
                os_version: { type: string, maxLength: 30 }
                device_name: { type: string }
      responses:
        "201": { description: Created }

  /devices/test:
    post:
      operationId: testDevice
      tags: [devices]
      summary: Send a test push notification
      responses:
        "200": { description: OK }

  /api-tokens:
    get:
      operationId: listApiTokens
      tags: [profile]
      summary: List the user's personal access tokens (mobile-only; excludes the app's own session tokens)
      responses:
        "200":
          {
            description: OK,
            content:
              {
                application/json:
                  {
                    schema:
                      {
                        type: array,
                        items: { $ref: "#/components/schemas/ApiToken" },
                      },
                  },
              },
          }
    post:
      operationId: createApiToken
      tags: [profile]
      summary: Create a personal access token and return its one-time plaintext secret
      description: >-
        Requires the `tokens:manage` ability, which an iOS OAuth session is
        never issued — this endpoint is unreachable from the app and returns
        403. Authority attenuates: a token-authenticated caller may only
        request capabilities its own credential already holds.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [name, abilities]
              properties:
                name: { type: string, maxLength: 255 }
                abilities:
                  type: array
                  minItems: 1
                  maxItems: 20
                  items: { $ref: "#/components/schemas/DelegableAbility" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string }
                  name: { type: string }
                  plaintext:
                    type: string
                    description: >-
                      Shown only in this response. A bearer credential —
                      excluded from application telemetry, and must not be
                      logged.
        "403":
          {
            description: "Requested capabilities exceed those of the calling credential",
          }
        "422":
          {
            description: "abilities omitted, empty, or containing an unknown or non-delegable value",
          }

  /api-tokens/{id}:
    delete:
      operationId: deleteApiToken
      tags: [profile]
      summary: Revoke a personal access token
      parameters: [{ $ref: "#/components/parameters/NumericId" }]
      responses:
        "204": { description: No content }
        "404":
          { description: "Not found, or one of the app's own session tokens" }

  /devices/{id}:
    delete:
      operationId: deleteDevice
      tags: [devices]
      summary: Unregister a device
      parameters: [{ $ref: "#/components/parameters/NumericId" }]
      responses:
        "204": { description: No content }
        "404": { $ref: "#/components/responses/NotFound" }

  /health/samples:
    post:
      operationId: ingestHealthSamples
      tags: [health]
      summary: Ingest a batch of HealthKit samples (mobile-only)
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [samples]
              properties:
                samples:
                  type: array
                  minItems: 1
                  maxItems: 500
                  items:
                    type: object
                    required: [external_id, type, start]
                    properties:
                      external_id: { type: string, maxLength: 100 }
                      type: { type: string, maxLength: 100 }
                      start: { type: string, format: date-time }
                      end: { type: string, format: date-time }
                      value: { type: number }
                      unit: { type: string, maxLength: 40 }
                      source: { type: string, maxLength: 100 }
                      metadata: { type: object }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  results:
                    type: array
                    items:
                      type: object
                      properties:
                        external_id: { type: string }
                        status:
                          {
                            type: string,
                            enum: [created, duplicate, skipped, error],
                          }

  /live-activities:
    post:
      operationId: startLiveActivity
      tags: [live-activities]
      summary: Start an iOS Live Activity (mobile-only)
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [activity_id, activity_type, push_token]
              properties:
                activity_id: { type: string, format: uuid }
                activity_type: { type: string, maxLength: 60 }
                push_token: { type: string, minLength: 16 }
                device_id: { type: [integer, "null"] }
                content_state: { type: object }
      responses:
        "201":
          {
            description: Created,
            content:
              {
                application/json:
                  {
                    schema: { $ref: "#/components/schemas/LiveActivityToken" },
                  },
              },
          }

  /live-activities/{id}:
    patch:
      operationId: updateLiveActivity
      tags: [live-activities]
      summary: Push a content state update (rate-limited to 16/hour/activity)
      parameters: [{ $ref: "#/components/parameters/NumericId" }]
      requestBody:
        content:
          application/json:
            schema:
              {
                type: object,
                required: [content_state],
                properties:
                  { content_state: { type: object }, alert: { type: object } },
              }
      responses:
        "200":
          {
            description: OK,
            content:
              {
                application/json:
                  {
                    schema: { $ref: "#/components/schemas/LiveActivityToken" },
                  },
              },
          }
        "429": { description: Rate limit exceeded (16 pushes/hour) }
    delete:
      operationId: endLiveActivity
      tags: [live-activities]
      summary: End a Live Activity
      parameters: [{ $ref: "#/components/parameters/NumericId" }]
      responses:
        "204": { description: No content }

  /live-activities/{id}/tokens:
    post:
      operationId: rotateLiveActivityToken
      tags: [live-activities]
      summary: Rotate the push token for a running Live Activity
      parameters: [{ $ref: "#/components/parameters/NumericId" }]
      requestBody:
        content:
          application/json:
            schema:
              {
                type: object,
                required: [push_token],
                properties: { push_token: { type: string } },
              }
      responses:
        "200":
          {
            description: OK,
            content:
              {
                application/json:
                  {
                    schema: { $ref: "#/components/schemas/LiveActivityToken" },
                  },
              },
          }

  /check-ins:
    get:
      operationId: checkInStatus
      tags: [check-ins]
      summary: Morning/afternoon check-in status for a date
      parameters:
        - {
            name: date,
            in: query,
            required: true,
            schema: { type: string, format: date },
          }
      responses:
        "200": { description: OK }
    post:
      operationId: submitCheckIn
      tags: [check-ins]
      summary: Submit a check-in (idempotent by period + date)
      parameters:
        - { $ref: "#/components/parameters/IdempotencyKeyOptional" }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [period, physical, mental, date]
              properties:
                period: { type: string, enum: [morning, afternoon] }
                physical: { type: integer, minimum: 1, maximum: 5 }
                mental: { type: integer, minimum: 1, maximum: 5 }
                date: { type: string, format: date }
                latitude: { type: number, minimum: -90, maximum: 90 }
                longitude: { type: number, minimum: -180, maximum: 180 }
                address: { type: string, maxLength: 255 }
                notes: { type: string, maxLength: 1000 }
      responses:
        "201":
          {
            description: Created,
            content:
              {
                application/json:
                  { schema: { $ref: "#/components/schemas/CompactEvent" } },
              },
          }

  /check-ins/history:
    get:
      operationId: checkInHistory
      tags: [check-ins]
      summary: Day-by-day check-in summary for a date range (max 90 days)
      parameters:
        - {
            name: from,
            in: query,
            required: true,
            schema: { type: string, format: date },
          }
        - {
            name: to,
            in: query,
            required: true,
            schema: { type: string, format: date },
          }
      responses:
        "200": { description: OK }
        "422": { $ref: "#/components/responses/ValidationError" }

  /check-ins/timezone:
    get:
      operationId: getCheckInTimezone
      tags: [check-ins]
      summary: Effective timezone state
      responses:
        "200": { description: OK }
    post:
      operationId: setCheckInTimezone
      tags: [check-ins]
      summary: Record an acknowledged timezone change (idempotent)
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [timezone]
              properties:
                timezone: { type: string }
                previous_timezone:
                  {
                    type: string,
                    description: "Informational only — the effective prior timezone is derived server-side",
                  }
                device_id: { type: string, maxLength: 255 }
      responses:
        "200": { description: Already effective (no-op) }
        "201": { description: New acknowledgement recorded }

  /check-ins/media:
    post:
      operationId: uploadCheckInMedia
      tags: [check-ins]
      summary: Upload a check-in photo (raw binary body, not multipart)
      parameters:
        - { name: date, in: query, schema: { type: string, format: date } }
      requestBody:
        content:
          image/jpeg: { schema: { type: string, format: binary } }
          image/png: { schema: { type: string, format: binary } }
          image/heic: { schema: { type: string, format: binary } }
          image/heif: { schema: { type: string, format: binary } }
          image/webp: { schema: { type: string, format: binary } }
      responses:
        "201":
          {
            description: Created,
            content:
              {
                application/json:
                  { schema: { $ref: "#/components/schemas/CompactEvent" } },
              },
          }
        "415": { description: Unsupported Content-Type }
        "422": { description: Empty body or over the 25 MB cap }

  /settings/notifications:
    get:
      operationId: getNotificationSettings
      tags: [settings]
      summary: Current notification preferences
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  categories:
                    type: object
                    description: >-
                      Keyed by notification type. Unset types default to true.
                    additionalProperties: { type: boolean }
                    propertyNames:
                      { $ref: "#/components/schemas/NotificationType" }
                  delivery_mode:
                    {
                      type: string,
                      enum: [immediate, work_hours, daily_digest],
                    }
                  digest_time: { type: string, pattern: "^\\d{2}:\\d{2}$" }
    patch:
      operationId: updateNotificationSettings
      tags: [settings]
      summary: Update notification preferences (handled by a distinct write controller)
      description: >-
        Unless delivery_mode is work_hours, every notification type must be
        present in categories — this endpoint replaces the whole set rather than
        merging.
      parameters: [{ $ref: "#/components/parameters/IfMatch" }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [delivery_mode]
              properties:
                categories:
                  type: object
                  additionalProperties: { type: boolean }
                  propertyNames:
                    { $ref: "#/components/schemas/NotificationType" }
                delivery_mode:
                  { type: string, enum: [immediate, work_hours, daily_digest] }
                digest_time: { type: string, pattern: "^\\d{2}:\\d{2}$" }
      responses:
        "204": { description: "No content (delivery_mode = work_hours)" }
        "200": { description: OK }

  /anomalies/{id}/acknowledge:
    post:
      operationId: acknowledgeAnomaly
      tags: [feed]
      summary: Acknowledge a metric anomaly
      parameters: [{ $ref: "#/components/parameters/EntityId" }]
      requestBody:
        content:
          application/json:
            schema:
              {
                type: object,
                properties:
                  {
                    note: { type: string, maxLength: 500 },
                    suppress_until: { type: string, format: date },
                  },
              }
      responses:
        "200": { description: OK }
        "404": { $ref: "#/components/responses/NotFound" }

  /knowledge/events/{id}/reprocess:
    post:
      operationId: reprocessKnowledgeEvent
      tags: [entities]
      summary: Queue AI reprocessing for a Fetch or Newsletter knowledge event
      parameters:
        [
          { $ref: "#/components/parameters/EntityId" },
          { $ref: "#/components/parameters/IfMatch" },
        ]
      requestBody:
        content:
          application/json:
            schema:
              {
                type: object,
                properties:
                  {
                    mode:
                      {
                        type: string,
                        enum: [auto, summary_only, refetch],
                        default: auto,
                      },
                  },
              }
      responses:
        "202": { description: Queued }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /bookmarks:
    post:
      operationId: createBookmark
      tags: [entities]
      summary: Bookmark a URL shared from the iOS share extension
      requestBody:
        content:
          application/json:
            schema:
              {
                type: object,
                required: [url],
                properties:
                  { url: { type: string, format: uri, maxLength: 2048 } },
              }
      responses:
        "201": { description: Created }
        "200": { description: Already bookmarked }
        "422": { $ref: "#/components/responses/ValidationError" }

  /bookmarks/capture:
    post:
      operationId: captureBookmark
      tags: [entities]
      x-spark-ability: ios:write
      summary: Save HTML rendered in Safari as a bookmark
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [url, html]
              properties:
                url: { type: string, format: uri, maxLength: 2048 }
                title: { type: [string, "null"], maxLength: 1000 }
                html: { type: string, maxLength: 5242880 }
      responses:
        "201": { description: Captured as a new bookmark }
        "200": { description: Existing bookmark recaptured }
        "403": { description: Token lacks ios:write }
        "422": { $ref: "#/components/responses/ValidationError" }

  /up-to-speed:
    get:
      operationId: upToSpeed
      tags: [up-to-speed]
      summary: Ordered catch-up queue (Flint digests, check-ins, anomalies, news)
      responses:
        "200": { description: OK }

  /up-to-speed/read:
    post:
      operationId: markUpToSpeedRead
      tags: [up-to-speed]
      summary: Mark Up to Speed items as caught up (idempotent)
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [items]
              properties:
                items:
                  type: array
                  minItems: 1
                  maxItems: 50
                  items:
                    type: object
                    properties:
                      type:
                        {
                          type: string,
                          enum: [flint_digest, anomaly, news_summary],
                        }
                      id: { type: string, format: uuid }
      responses:
        "200": { description: OK }

  /flint/digests:
    get:
      operationId: listFlintDigests
      tags: [flint]
      summary: Flint digest(s) for a date or bounded local-day history range
      description: >-
        Preserve the date/period/all contract when from and to are absent.
        Supplying both from and to selects the cursor-paginated History
        contract. The inclusive range is interpreted in the account's
        effective timezone and may contain at most 30 local calendar days.
      parameters:
        - name: date
          in: query
          schema: { type: string, format: date, default: today }
        - name: period
          in: query
          schema: { type: string, enum: [morning, afternoon, evening] }
        - { name: all, in: query, schema: { type: boolean, default: false } }
        - { name: from, in: query, schema: { type: string, format: date } }
        - { name: to, in: query, schema: { type: string, format: date } }
        - {
            name: limit,
            in: query,
            schema: { type: integer, minimum: 1, maximum: 50, default: 20 },
          }
        - { name: cursor, in: query, schema: { type: string } }
      responses:
        "200":
          description: Date-oriented digest response or History page
          content:
            application/json:
              schema:
                oneOf:
                  - { $ref: "#/components/schemas/FlintDigest" }
                  - { $ref: "#/components/schemas/FlintDigestDay" }
                  - { $ref: "#/components/schemas/FlintDigestHistoryPage" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }
    post:
      operationId: createFlintDigest
      tags: [flint]
      summary: Create a Flint digest event with attached blocks (non-idempotent)
      requestBody:
        content:
          application/json:
            schema:
              {
                type: object,
                required: [title],
                properties:
                  {
                    title: { type: string },
                    period: { type: string },
                    date: { type: string, format: date },
                    summary: { type: string },
                    opener: { type: string },
                    blocks: { type: array, items: { type: object } },
                  },
              }
      responses:
        "201": { description: Created }
        "422": { $ref: "#/components/responses/ValidationError" }

  /flint/digests/latest:
    get:
      operationId: getLatestFlintDigest
      tags: [flint]
      summary: The single most recent digest across dates
      description: >-
        For "the newest thing Flint has written" — not expressible via the
        date-scoped /flint/digests alone before the day's first digest has
        run (the newest digest is still yesterday evening's).
      parameters:
        - {
            name: kind,
            in: query,
            schema:
              { type: string, enum: [briefing, news_roundup, reading_list] },
          }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FlintDigest" }
        "404": { $ref: "#/components/responses/NotFound" }

  /flint/digests/{id}:
    get:
      operationId: getFlintDigest
      tags: [flint]
      summary: A single Flint digest
      parameters: [{ $ref: "#/components/parameters/EntityId" }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FlintDigest" }
        "404": { $ref: "#/components/responses/NotFound" }

  /flint/questions:
    get:
      operationId: listFlintQuestions
      tags: [flint]
      summary: Cursor-paginated questions across recent digests
      description: >-
        Defaults to open questions bounded by the seven-day retirement
        horizon. status accepts a comma-separated list
        (open,answered,skipped,retired), and since (an ISO timestamp or a
        relative window like 48h/7d) bounds the query server-side when
        provided. Reader-facing representations omit internal question
        priority.
      parameters:
        - {
            name: status,
            in: query,
            schema: { type: string, default: open },
            description: "Comma-separated: open, answered, skipped, retired.",
          }
        - {
            name: since,
            in: query,
            schema: { type: string },
            description: "ISO timestamp, or a relative window like 48h or 7d.",
          }
        - {
            name: limit,
            in: query,
            schema: { type: integer, minimum: 1, maximum: 50, default: 20 },
          }
        - { name: cursor, in: query, schema: { type: string } }
      responses:
        "200":
          description: OK, including an empty data array
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FlintQuestionPage" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /flint/questions/{block}/actions:
    post:
      operationId: appendFlintQuestionAction
      tags: [flint]
      summary: Append a versioned answer, correction, or skip
      description: >-
        Idempotent by account and Idempotency-Key. An identical replay returns
        200 even when the original If-Match value is now stale. Reusing the key
        with different content returns 409.
      parameters:
        - $ref: "#/components/parameters/FlintQuestionBlockId"
        - $ref: "#/components/parameters/IfMatch"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FlintQuestionActionInput" }
      responses:
        "200":
          description: Idempotent replay
          headers:
            ETag: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FlintQuestionResponse" }
        "201":
          description: Action appended
          headers:
            ETag: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FlintQuestionResponse" }
        "403": { description: Question does not belong to the caller }
        "409":
          description: Idempotency key reused with different content
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "412": { $ref: "#/components/responses/PreconditionFailed" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "428": { $ref: "#/components/responses/PreconditionRequired" }

  /flint/questions/{block}/answer:
    post:
      operationId: answerFlintQuestionLegacy
      tags: [flint]
      deprecated: true
      summary: Legacy compatibility adapter for answering a question
      description: Writes through the canonical question-action service.
      parameters:
        - $ref: "#/components/parameters/FlintQuestionBlockId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LegacyFlintAnswerInput" }
      responses:
        "200":
          description: OK
          headers:
            Deprecation:
              schema: { type: string, const: "true" }
            Sunset:
              schema: { type: string }
              description: HTTP-date after which the adapter may be removed.
          content:
            application/json:
              schema:
                type: object
                required: [block_id, answer, answer_note, answered_at]
                properties:
                  block_id: { type: string, format: uuid }
                  answer: { type: string }
                  answer_note: { type: [string, "null"] }
                  answered_at: { type: string, format: date-time }
        "403": { description: Block does not belong to the caller }
        "422": { $ref: "#/components/responses/ValidationError" }

  /flint/topics:
    get:
      operationId: listFlintTopics
      tags: [flint]
      summary: List the account's long-lived Flint Threads
      description: >-
        Cursor-paginated with the same envelope as every other mobile
        collection endpoint, even though the list is short today.
      parameters:
        - {
            name: status,
            in: query,
            schema:
              { type: string, enum: [active, dormant, resolved, expired] },
          }
        - {
            name: kind,
            in: query,
            schema: { type: string, enum: [strategic, thematic, tactical] },
          }
        - {
            name: limit,
            in: query,
            schema: { type: integer, minimum: 1, maximum: 100, default: 50 },
          }
        - { name: cursor, in: query, schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data, next_cursor, has_more]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/FlintTopic" }
                  next_cursor: { type: [string, "null"] }
                  has_more: { type: boolean }
        "422": { $ref: "#/components/responses/ValidationError" }

  /flint/topics/{id}:
    get:
      operationId: getFlintTopic
      tags: [flint]
      summary: Get a versioned Thread and its digest/block evidence
      parameters: [{ $ref: "#/components/parameters/EntityId" }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/FlintTopicDetail" }
        "404": { $ref: "#/components/responses/NotFound" }

  /flint/notes:
    get:
      operationId: listFlintNotes
      tags: [flint]
      summary: Cursor-paginated user-authored Flint notes
      parameters:
        - {
            name: limit,
            in: query,
            schema: { type: integer, minimum: 1, maximum: 50, default: 20 },
          }
        - { name: cursor, in: query, schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FlintNotePage" }
        "422": { $ref: "#/components/responses/ValidationError" }
    post:
      operationId: createFlintNote
      tags: [flint]
      summary: Create an idempotent, searchable Flint note
      description: >-
        The title is derived from authored_at in the effective timezone using
        "Note to Flint dd/mm/yy HH:mm". Same-minute collisions receive (2),
        (3), and so on. Note prose is excluded from telemetry and audit
        properties.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FlintNoteInput" }
      responses:
        "200":
          description: Identical client mutation replay
          headers:
            ETag: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FlintNoteResponse" }
        "201":
          description: Created
          headers:
            ETag: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FlintNoteResponse" }
        "409":
          description: Client mutation ID reused with different content
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /flint/notes/{id}:
    delete:
      operationId: deleteFlintNote
      tags: [flint]
      summary: Idempotently soft-delete an owned Flint note
      description: >-
        Missing, already-deleted, and other-account IDs all return 204 so the
        route does not disclose ownership.
      parameters: [{ $ref: "#/components/parameters/EntityId" }]
      responses:
        "204": { description: Deleted or already absent from this account }

  /flint/routines/health:
    get:
      operationId: getFlintRoutineHealth
      tags: [flint]
      summary: Flint routine configuration, scheduling, attempt, and output health
      description: >-
        Provider acceptance is reported as accepted, never success. Success
        requires observed run-bound persisted output or an authenticated
        completion action. Secrets, endpoint URLs, raw provider responses, and
        exception messages are omitted.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                { $ref: "#/components/schemas/FlintRoutineHealthResponse" }

  /money/accounts:
    get:
      operationId: listMoneyAccounts
      tags: [money]
      summary: All non-archived finance accounts with latest balance
      description: >-
        Cursor-paginated with the same envelope as every other mobile
        collection endpoint, even though the list is short today.
      parameters:
        - {
            name: limit,
            in: query,
            schema: { type: integer, minimum: 1, maximum: 100, default: 50 },
          }
        - { name: cursor, in: query, schema: { type: string } }
      responses:
        "200":
          {
            description: OK,
            content:
              {
                application/json:
                  {
                    schema:
                      {
                        type: object,
                        properties:
                          {
                            data:
                              {
                                type: array,
                                items:
                                  { $ref: "#/components/schemas/MoneyAccount" },
                              },
                            next_cursor: { type: [string, "null"] },
                            has_more: { type: boolean },
                          },
                      },
                  },
              },
          }
    post:
      operationId: createMoneyAccount
      tags: [money]
      summary: Create a manual finance account
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [name, account_type, currency]
              properties:
                name: { type: string, maxLength: 255 }
                account_type:
                  {
                    type: string,
                    enum:
                      [
                        current_account,
                        savings_account,
                        mortgage,
                        investment_account,
                        credit_card,
                        loan,
                        pension,
                        other,
                      ],
                  }
                currency: { type: string, enum: [GBP, USD, EUR] }
                provider: { type: string }
                account_number: { type: string }
                sort_code: { type: string, maxLength: 8 }
                interest_rate: { type: number, minimum: 0, maximum: 100 }
                start_date: { type: string, format: date }
                is_negative_balance: { type: boolean }
      responses:
        "201":
          {
            description: Created,
            content:
              {
                application/json:
                  { schema: { $ref: "#/components/schemas/MoneyAccount" } },
              },
          }

  /money/accounts/{id}:
    get:
      operationId: getMoneyAccount
      tags: [money]
      summary: A single finance account
      parameters: [{ $ref: "#/components/parameters/EntityId" }]
      responses:
        "200":
          {
            description: OK,
            content:
              {
                application/json:
                  { schema: { $ref: "#/components/schemas/MoneyAccount" } },
              },
          }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      operationId: updateMoneyAccount
      tags: [money]
      summary: Update a manual finance account, or pin/unpin any account
      description: >-
        is_pinned is a user preference rather than account data, so it
        applies to any account the user owns — synced Monzo/GoCardless
        accounts included. Every other field remains manual_account only.
        Setting is_pinned true clears it on every other account first (at
        most one pinned account per user).
      parameters:
        [
          { $ref: "#/components/parameters/EntityId" },
          { $ref: "#/components/parameters/IfMatch" },
        ]
      requestBody:
        content:
          application/json:
            schema:
              {
                type: object,
                description: "Same fields as create, all optional, plus is_pinned (boolean).",
              }
      responses:
        "200": { description: OK }
        "422":
          {
            description: "A field other than is_pinned was sent for a non-manual_account.",
          }
    delete:
      operationId: archiveMoneyAccount
      tags: [money]
      summary: Archive a manual finance account (never hard-deletes)
      parameters:
        [
          { $ref: "#/components/parameters/EntityId" },
          { $ref: "#/components/parameters/IfMatch" },
        ]
      responses:
        "200": { description: Archived }
        "422": { description: Account is not manual_account }

  /money/accounts/{id}/balances:
    get:
      operationId: listMoneyAccountBalances
      tags: [money]
      summary: Cursor-paginated balance history
      parameters: [{ $ref: "#/components/parameters/EntityId" }]
      responses:
        "200":
          {
            description: OK,
            content:
              {
                application/json:
                  {
                    schema:
                      {
                        type: object,
                        properties:
                          {
                            data:
                              {
                                type: array,
                                items:
                                  { $ref: "#/components/schemas/BalanceEntry" },
                              },
                          },
                      },
                  },
              },
          }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      operationId: addMoneyAccountBalance
      tags: [money]
      summary: Add a balance entry
      parameters:
        [
          { $ref: "#/components/parameters/EntityId" },
          { $ref: "#/components/parameters/IfMatch" },
          { $ref: "#/components/parameters/IdempotencyKeyOptional" },
        ]
      requestBody:
        content:
          application/json:
            schema:
              {
                type: object,
                required: [balance, date],
                properties:
                  {
                    balance: { type: number },
                    date: { type: string, format: date },
                    notes: { type: string, maxLength: 1000 },
                  },
              }
      responses:
        "201":
          {
            description: Created,
            content:
              {
                application/json:
                  { schema: { $ref: "#/components/schemas/BalanceEntry" } },
              },
          }

  /money/net-worth:
    get:
      operationId: getNetWorth
      tags: [money]
      summary: Current net worth and its change over a comparison window
      description: >-
        Net worth and its change in one request, replacing an N+1
        client-side reconciliation across every account's balance history.
        total sums every eligible (same-currency) account's latest balance,
        new or old. comparison.then/change/change_pct only include accounts
        whose history reaches the comparison window — a brand-new account
        would otherwise read as pure growth. Multi-currency conversion isn't
        implemented; accounts in another currency are excluded entirely.
      parameters:
        - name: compare
          in: query
          schema:
            {
              type: string,
              enum: [1week, 1month, 3months, 6months, 1year],
              default: 1month,
            }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/NetWorth" }
        "422": { $ref: "#/components/responses/ValidationError" }

components:
  securitySchemes:
    sparkToken:
      type: http
      scheme: bearer
      description: >
        Laravel Sanctum personal access token. Read operations and POST /logout
        require ios:read; every other write operation additionally requires
        ios:write. POST /api-tokens is a separate exception: it requires
        tokens:manage, which an iOS OAuth session is never issued, so a
        compromised app session cannot mint itself a longer-lived credential.

  parameters:
    EntityId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    NumericId:
      name: id
      in: path
      required: true
      schema: { type: integer }
    EntityKind:
      name: kind
      in: path
      required: true
      schema: { type: string, enum: [events, objects, blocks] }
    IfMatch:
      name: If-Match
      in: header
      required: true
      schema: { type: string }
      description: "The entity's current ETag. Missing returns 428; stale returns 412 — both surfacing the current ETag."
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, format: uuid }
      description: Account-scoped UUID identifying one client mutation.
    IdempotencyKeyOptional:
      name: Idempotency-Key
      in: header
      required: false
      schema: { type: string }
      description: >-
        Optional. When present, a retried request with the same key (scoped
        per user and per endpoint, 24h) replays the first successful
        response instead of re-running the mutation. Absent, the request just
        runs normally.
    FlintQuestionBlockId:
      name: block
      in: path
      required: true
      schema: { type: string, format: uuid }

  responses:
    NotFound:
      description: Not found or not owned by the caller
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    ValidationError:
      description: Validation failed
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    PreconditionRequired:
      description: Missing If-Match header
      headers:
        ETag:
          description: Current strong resource version.
          schema: { type: string }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    PreconditionFailed:
      description: Stale If-Match value
      headers:
        ETag:
          description: Current strong resource version.
          schema: { type: string }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

  schemas:
    Error:
      type: object
      properties:
        message: { type: string }
        hint: { type: string }
        etag:
          type: string
          description: Current strong ETag on question precondition failures.
        errors: { type: object }

    UserProfile:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        email: { type: string, format: email }
        timezone: { type: [string, "null"] }
        avatar_url: { type: "null" }

    CompactEvent:
      type: object
      description: App\Http\Resources\Compact\CompactEventResource
      properties:
        id: { type: string, format: uuid }
        time: { type: string, format: date-time }
        service: { type: string }
        domain: { type: string }
        action: { type: string }
        group_key:
          {
            type: string,
            description: "service:action:actor_id — consecutive events sharing this key are one run (e.g. twenty Spotify plays).",
          }
        value: { type: string }
        unit: { type: string }
        display_value: { type: string }
        direction:
          {
            type: string,
            enum: [in, out, internal, excluded, unknown],
            description: "Money events only (domain=money, value set) — resolved server-side so the client never infers direction from the action-name suffix.",
          }
        url: { type: string }
        actor: { type: object }
        target: { type: object }
        tags: { type: array, items: { type: object } }
        tldr: { type: string }
        note: { type: string }
        blocks_count: { type: integer }
        blocks:
          { type: array, items: { $ref: "#/components/schemas/CompactBlock" } }
        display_name: { type: string }
        display_with_object: { type: boolean }
        hidden: { type: boolean }

    CompactObject:
      type: object
      description: App\Http\Resources\Compact\CompactObjectResource
      properties:
        id: { type: string, format: uuid }
        concept: { type: string }
        type: { type: string }
        title: { type: string }
        time: { type: string, format: date-time }
        content: { type: string }
        url: { type: string }
        media_url: { type: string }
        recent_events:
          { type: array, items: { $ref: "#/components/schemas/CompactEvent" } }

    CompactBlock:
      type: object
      description: App\Http\Resources\Compact\CompactBlockResource
      properties:
        id: { type: string, format: uuid }
        block_type: { type: string }
        title: { type: string }
        time: { type: string, format: date-time }
        content: { type: string }
        value: { type: string }
        unit: { type: string }
        media_url: { type: string }

    CompactIntegration:
      type: object
      properties:
        id: { type: string, format: uuid }
        service: { type: string }
        name: { type: string }
        instance_type: { type: string }
        status: { type: string }

    CompactMetric:
      type: object
      properties:
        id: { type: string, format: uuid }
        identifier: { type: string }
        display_name: { type: string }
        service: { type: string }
        domain: { type: string }
        action: { type: string }
        unit: { type: string }
        event_count: { type: integer }
        mean: { type: [number, "null"] }
        last_event_at: { type: [string, "null"], format: date-time }

    CompactPlace:
      type: object
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        type: { type: string }
        latitude: { type: number }
        longitude: { type: number }
        address: { type: string }
        category: { type: string }

    CompactNotification:
      type: object
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        body: { type: [string, "null"] }
        domain: { type: [string, "null"] }
        is_read: { type: boolean }
        received_at: { type: string, format: date-time }
        entity:
          {
            type: [object, "null"],
            properties: { kind: { type: string }, id: { type: string } },
          }
        version:
          type: string
          description: >-
            Strong entity tag. Send as If-Match on DELETE /notifications/{id}.

    DelegableAbility:
      type: string
      description: >-
        A capability a personal access token may be granted
        (App\Support\SparkAbility::DELEGABLE). Wildcards are absent by design:
        `*` satisfies every capability check, so it is not a capability but an
        escape from the capability system. `ios:read`, `ios:write` and
        `mcp:read` are never delegable.
      enum:
        - bookmark:write
        - data:image
        - data:read
        - data:write
        - finance:read
        - finance:write
        - flint:read
        - flint:run
        - flint:write
        - insights:read
        - insights:write
        - integrations:read
        - integrations:sync
        - tokens:manage

    NotificationType:
      type: string
      description: >-
        A notification type a user may switch on and off
        (App\Notifications\NotificationCatalogue::configurableTypes()). These are
        the strings a notification's getNotificationType() returns, because that
        is what SparkNotification::via() gates delivery on. The earlier
        categories — anomaly, digest, new_bookmark, calendar_event — named
        notifications Spark never sends and have been withdrawn.
      enum:
        - integration_completed
        - integration_failed
        - integration_authentication_failed
        - cookie_expiry_warning
        - fetch_multiple_failures
        - fetch_content_changed
        - migration_completed
        - migration_failed
        - data_export_ready
        - system_maintenance

    ApiToken:
      type: object
      description: App\Http\Resources\Compact\ApiTokenResource — never includes the plaintext secret
      properties:
        id: { type: string }
        name: { type: string }
        abilities: { type: array, items: { type: string } }
        last_used_at: { type: [string, "null"], format: date-time }
        created_at: { type: [string, "null"], format: date-time }

    LiveActivityToken:
      type: object
      properties:
        id: { type: integer }
        activity_id: { type: string, format: uuid }
        activity_type: { type: string }
        starts_at: { type: string, format: date-time }
        ends_at: { type: [string, "null"], format: date-time }
        last_pushed_at: { type: [string, "null"], format: date-time }

    FlintDigest:
      type: object
      required:
        [
          event_id,
          date,
          title,
          version,
          block_count,
          unanswered_question_count,
          blocks,
        ]
      properties:
        event_id: { type: string, format: uuid }
        digest_object_id: { type: [string, "null"], format: uuid }
        date: { type: string, format: date }
        effective_timezone:
          {
            type: string,
            description: "IANA timezone the day/date above resolved in — see the Timezone Contract in mobile_API.md.",
          }
        period:
          { type: [string, "null"], enum: [morning, afternoon, evening, null] }
        kind: { type: [string, "null"] }
        title: { type: string }
        summary: { type: [string, "null"] }
        opener:
          {
            type: [string, "null"],
            description: "The digest's lede sentence, published as its own field so the client renders it verbatim. Explicit when the generating skill sends one; otherwise a best-effort extraction from summary.",
          }
        created_at: { type: string, format: date-time }
        version:
          type: string
          description: Strong opaque version of the digest event.
        block_count: { type: integer, minimum: 0 }
        unanswered_question_count: { type: integer, minimum: 0 }
        blocks:
          type: array
          description: >-
            Full reader-facing blocks. Question blocks omit priority and
            include status and ordered answer_history.
          items: { type: object, additionalProperties: true }

    FlintDigestDay:
      type: object
      required: [date, count, digests]
      properties:
        date: { type: string, format: date }
        count: { type: integer, minimum: 0 }
        digests:
          type: array
          items: { $ref: "#/components/schemas/FlintDigest" }

    FlintDigestHistoryItem:
      type: object
      required:
        [
          id,
          local_date,
          title,
          generated_at,
          unanswered_question_count,
          version,
          freshness,
        ]
      properties:
        id: { type: string, format: uuid }
        local_date: { type: string, format: date }
        period:
          { type: [string, "null"], enum: [morning, afternoon, evening, null] }
        kind: { type: [string, "null"] }
        title: { type: string }
        summary: { type: [string, "null"] }
        generated_at: { type: string, format: date-time }
        updated_at: { type: [string, "null"], format: date-time }
        unanswered_question_count: { type: integer, minimum: 0 }
        version:
          type: string
          description: Weak representation version suitable for list caching.
        freshness:
          type: object
          required: [state, age_seconds]
          properties:
            state: { type: string, enum: [fresh, stale] }
            age_seconds: { type: integer, minimum: 0 }

    FlintDigestHistoryPage:
      type: object
      required: [data, next_cursor, has_more, meta]
      properties:
        data:
          type: array
          items: { $ref: "#/components/schemas/FlintDigestHistoryItem" }
        next_cursor: { type: [string, "null"] }
        has_more: { type: boolean }
        meta:
          type: object
          required: [from, to, effective_timezone, account_id]
          properties:
            from: { type: string, format: date }
            to: { type: string, format: date }
            effective_timezone: { type: string }
            account_id: { type: string, format: uuid }

    FlintQuestionAction:
      type: object
      required: [id, action, answer, context, created_at]
      properties:
        id: { type: string }
        action: { type: string, enum: [answer, correct, skip] }
        answer: { type: [string, "null"] }
        context: { type: [string, "null"] }
        created_at: { type: [string, "null"], format: date-time }

    FlintQuestion:
      type: object
      required:
        [
          id,
          digest_id,
          source_digest,
          status,
          question,
          answer_options,
          asked_at,
          effective_answer,
          answer_history,
          version,
        ]
      properties:
        id: { type: string, format: uuid }
        digest_id: { type: string, format: uuid }
        source_digest:
          type: object
          required: [local_date, period]
          properties:
            local_date: { type: [string, "null"], format: date }
            period:
              {
                type: [string, "null"],
                enum: [morning, afternoon, evening, null],
              }
        status: { type: string, enum: [open, answered, skipped, retired] }
        title:
          {
            type: string,
            description: "The digest block's short label — the same title the block shows inline; question carries the full text.",
          }
        question: { type: string }
        topic: { type: [string, "null"] }
        answer_options:
          type: [array, "null"]
          items: { type: string }
        asked_at:
          type: [string, "null"]
          format: date-time
          description: When Flint wrote the question — not the digest's local day.
        effective_answer:
          oneOf:
            - type: "null"
            - type: object
              required: [answer, context, answered_at]
              properties:
                answer: { type: [string, "null"] }
                context: { type: [string, "null"] }
                answered_at: { type: [string, "null"], format: date-time }
        answer_history:
          type: array
          items: { $ref: "#/components/schemas/FlintQuestionAction" }
        version:
          type: string
          description: Strong opaque Block version for If-Match.

    FlintQuestionPage:
      type: object
      required: [data, next_cursor, has_more, meta]
      properties:
        data:
          type: array
          items: { $ref: "#/components/schemas/FlintQuestion" }
        next_cursor: { type: [string, "null"] }
        has_more: { type: boolean }
        meta:
          type: object
          required: [effective_timezone, account_id]
          properties:
            effective_timezone: { type: string }
            account_id: { type: string, format: uuid }

    FlintQuestionResponse:
      type: object
      required: [data]
      properties:
        data: { $ref: "#/components/schemas/FlintQuestion" }

    FlintQuestionActionInput:
      oneOf:
        - type: object
          required: [action, answer]
          properties:
            action: { type: string, const: answer }
            answer: { type: string, maxLength: 1000 }
            context: { type: [string, "null"], maxLength: 1000 }
        - type: object
          required: [action, answer]
          properties:
            action: { type: string, const: correct }
            answer: { type: string, maxLength: 1000 }
            context: { type: [string, "null"], maxLength: 1000 }
        - type: object
          required: [action]
          properties:
            action: { type: string, const: skip }

    LegacyFlintAnswerInput:
      type: object
      required: [answer]
      properties:
        answer: { type: string, maxLength: 1000 }
        answer_note: { type: [string, "null"], maxLength: 1000 }

    FlintTopic:
      type: object
      required: [id, title]
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        content: { type: [string, "null"] }
        kind:
          {
            type: [string, "null"],
            enum: [strategic, thematic, tactical, null],
          }
        status:
          {
            type: [string, "null"],
            enum: [active, dormant, resolved, expired, null],
          }
        first_seen_at: { type: [string, "null"], format: date-time }
        last_touched_at: { type: [string, "null"], format: date-time }
        next_review_at: { type: [string, "null"], format: date }
        origin: { type: [string, "null"] }
        watching_for:
          {
            type: [string, "null"],
            description: "What would move this thread on. Explicit when the writer sends one; otherwise a best-effort extraction from content's closing sentence.",
          }

    FlintTopicMention:
      type: object
      required:
        [
          id,
          source_type,
          source_id,
          event_id,
          digest_id,
          block_id,
          title,
          local_date,
          period,
          occurred_at,
          deep_link,
          source_deleted,
        ]
      properties:
        id: { type: string, format: uuid }
        kind: { type: string, enum: [event, block] }
        source_type:
          { type: string, enum: [digest, digest_block, event, block] }
        source_id: { type: string, format: uuid }
        event_id: { type: string, format: uuid }
        digest_id: { type: [string, "null"], format: uuid }
        block_id: { type: [string, "null"], format: uuid }
        title: { type: string }
        detail: { type: [string, "null"] }
        excerpt: { type: [string, "null"] }
        local_date: { type: [string, "null"], format: date }
        period:
          { type: [string, "null"], enum: [morning, afternoon, evening, null] }
        occurred_at: { type: [string, "null"], format: date-time }
        deep_link: { type: string }
        source_deleted: { type: boolean }

    FlintTopicDetail:
      allOf:
        - { $ref: "#/components/schemas/FlintTopic" }
        - type: object
          required: [version, mentions]
          properties:
            version:
              type: string
              description: Strong opaque EventObject version.
            mentions:
              type: array
              items: { $ref: "#/components/schemas/FlintTopicMention" }

    FlintContextLink:
      type: object
      required: [type, id]
      properties:
        type: { type: string, enum: [event, digest, block, topic] }
        id: { type: string, format: uuid }

    FlintNote:
      type: object
      required:
        [
          id,
          title,
          body,
          authored_at,
          created_at,
          deleted_at,
          context_links,
          consent_version,
          consented_at,
          version,
        ]
      properties:
        id: { type: string, format: uuid }
        title:
          type: string
          example: Note to Flint 14/09/26 13:17
        body: { type: string }
        authored_at: { type: [string, "null"], format: date-time }
        created_at: { type: [string, "null"], format: date-time }
        deleted_at: { type: [string, "null"], format: date-time }
        context_links:
          type: array
          maxItems: 20
          items: { $ref: "#/components/schemas/FlintContextLink" }
        consent_version: { type: string, const: flint-note-v1 }
        consented_at: { type: [string, "null"], format: date-time }
        version:
          type: string
          description: Strong opaque EventObject version.

    FlintNoteInput:
      type: object
      required: [client_mutation_id, authored_at, body, consent_version]
      properties:
        client_mutation_id: { type: string, format: uuid }
        authored_at:
          type: string
          format: date-time
          description: May be at most five minutes in the future.
        body: { type: string, maxLength: 10000 }
        context_links:
          type: [array, "null"]
          maxItems: 20
          items: { $ref: "#/components/schemas/FlintContextLink" }
        consent_version: { type: string, const: flint-note-v1 }

    FlintNoteResponse:
      type: object
      required: [data]
      properties:
        data: { $ref: "#/components/schemas/FlintNote" }

    FlintNotePage:
      type: object
      required: [data, next_cursor, has_more, meta]
      properties:
        data:
          type: array
          items: { $ref: "#/components/schemas/FlintNote" }
        next_cursor: { type: [string, "null"] }
        has_more: { type: boolean }
        meta:
          type: object
          required: [effective_timezone, account_id]
          properties:
            effective_timezone: { type: string }
            account_id: { type: string, format: uuid }

    FlintRoutineAttempt:
      type: object
      properties:
        status:
          {
            type: string,
            enum:
              [accepted, success, failed, retrying, not_applicable, blocked],
          }
        accepted_at: { type: string, format: date-time }
        started_at: { type: string, format: date-time }
        completed_at: { type: string, format: date-time }
        run_uuid: { type: string, format: uuid }

    FlintRoutineHealth:
      type: object
      required:
        [
          routine,
          state,
          enabled,
          driver,
          next_eligible_run,
          last_attempt,
          last_persisted_output,
          failure,
        ]
      properties:
        routine:
          {
            type: string,
            enum:
              [
                morning_digest,
                evening_digest,
                topics,
                reading_list,
                news_roundup,
              ],
          }
        state:
          {
            type: string,
            enum: [configured, unconfigured, disabled, unavailable],
          }
        enabled: { type: boolean }
        driver: { type: string, enum: [webhook, openai] }
        next_eligible_run: { type: [string, "null"], format: date-time }
        last_attempt:
          oneOf:
            - type: "null"
            - { $ref: "#/components/schemas/FlintRoutineAttempt" }
        last_persisted_output:
          oneOf:
            - type: "null"
            - type: object
              properties:
                digest_id: { type: string, format: uuid }
                persisted_at: { type: [string, "null"], format: date-time }
        failure:
          oneOf:
            - type: "null"
            - type: object
              required: [status]
              properties:
                status: { type: string, enum: [failed, retrying] }
                occurred_at: { type: [string, "null"], format: date-time }

    FlintRoutineHealthResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items: { $ref: "#/components/schemas/FlintRoutineHealth" }
        meta:
          type: object
          required: [effective_timezone, account_id, management_url]
          properties:
            effective_timezone: { type: string }
            account_id: { type: string, format: uuid }
            management_url: { type: string, format: uri }

    MoneyAccount:
      type: object
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        kind: { type: string }
        account_type: { type: [string, "null"] }
        currency: { type: string }
        is_negative_balance: { type: boolean }
        provider: { type: [string, "null"] }
        account_number: { type: [string, "null"] }
        sort_code: { type: [string, "null"] }
        interest_rate: { type: [number, "null"] }
        start_date: { type: [string, "null"], format: date }
        integration_id: { type: [string, "null"] }
        is_pinned:
          {
            type: boolean,
            description: "The account the user chose to see first. At most one account is pinned per user; settable on any account type via PATCH, not just manual ones.",
          }
        latest_balance: { $ref: "#/components/schemas/BalanceEntry" }
        updated_at: { type: [string, "null"], format: date-time }

    NetWorthComparison:
      type: object
      properties:
        window: { type: string, enum: [1week, 1month, 3months, 6months, 1year] }
        then: { type: number }
        change: { type: number }
        change_pct: { type: [number, "null"] }

    NetWorth:
      type: object
      properties:
        total: { type: number }
        currency: { type: string }
        comparison: { $ref: "#/components/schemas/NetWorthComparison" }
        excluded_accounts:
          {
            type: integer,
            description: "Accounts left out of the comparison window (different currency, or history not spanning it); still counted in total.",
          }
        as_of: { type: string, format: date-time }

    BalanceEntry:
      type: object
      properties:
        id: { type: string, format: uuid }
        balance: { type: number }
        currency: { type: string }
        time: { type: [string, "null"], format: date-time }
        notes: { type: [string, "null"] }
