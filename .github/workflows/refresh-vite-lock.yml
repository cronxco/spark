name: Refresh Vite lock
on:
  pull_request:
    paths:
      - package.json
      - .github/workflows/refresh-vite-lock.yml
permissions:
  contents: read
jobs:
  refresh:
    if: github.head_ref == 'codex/vite-8-dev' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Regenerate the lock without running package scripts
        run: npm install --package-lock-only --ignore-scripts
      - name: Commit regenerated lock
        env:
          PR_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          git add package-lock.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m '⬆️ Regenerate Vite 8 lock on current dev'
          git push origin "HEAD:$PR_BRANCH"
