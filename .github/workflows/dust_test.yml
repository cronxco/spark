name: Dust and Test

on:
  pull_request:
  issue_comment:
    types: [created]

# Unrelated comments must not cancel a running PR test job.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.event.issue.number || github.ref }}-${{ github.event_name == 'issue_comment' && !contains(github.event.comment.body, '/test') && !contains(github.event.comment.body, '/run-tests') && github.run_id || 'tests' }}
  cancel-in-progress: true

jobs:
  duster:
    if: |
      github.event_name != 'issue_comment' ||
      (github.event.issue.pull_request && (contains(github.event.comment.body, '/test') || contains(github.event.comment.body, '/run-tests')))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    outputs:
      commit_sha: ${{ steps.get_sha.outputs.sha }}
    steps:
      - name: Add reaction to comment
        if: github.event_name == 'issue_comment'
        uses: peter-evans/create-or-update-comment@e8674b075228eee787fea43ef493e45ece1004c9 # v5
        with:
          comment-id: ${{ github.event.comment.id }}
          reactions: eyes

      - name: Get PR branch
        if: github.event_name == 'issue_comment'
        uses: xt0rted/pull-request-comment-branch@e8b8daa837e8ea7331c0003c9c316a64c6d8b0b1 # v3
        id: comment-branch

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event_name == 'issue_comment' && steps.comment-branch.outputs.head_ref || github.event.pull_request.head.ref }}
          repository: ${{ github.event_name == 'issue_comment' && steps.comment-branch.outputs.head_repo || github.event.pull_request.head.repo.full_name }}

      - name: "Duster Fix"
        uses: tighten/duster-action@557d11cf6d55a7f7cf6324806c633af0062759eb # v3
        with:
          args: fix

      - uses: stefanzweifel/git-auto-commit-action@778341af668090896ca464160c2def5d1d1a3eb0 # v6
        id: auto_commit_action
        with:
          commit_message: 🚨 Fix code style
          commit_user_name: GitHub Action
          commit_user_email: actions@github.com

      - name: Get current commit SHA
        id: get_sha
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  ci:
    runs-on: ubuntu-latest
    environment: CI
    needs: duster
    permissions:
      contents: read
      pull-requests: write

    services:
      postgres:
        image: "bsamasi/postgis-pgvector:pg17@sha256:f3133925f641c093fae3f83607cfe21eb6e401b6961ae1cac84f70ff6f767f59"
        env:
          PGPASSWORD: postgres
          POSTGRES_DB: laravel
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5

    steps:
      - name: Get PR branch
        if: github.event_name == 'issue_comment'
        uses: xt0rted/pull-request-comment-branch@e8b8daa837e8ea7331c0003c9c316a64c6d8b0b1 # v3
        id: comment-branch

      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          # Use the commit SHA from duster to ensure we test the code after any duster fixes
          ref: ${{ needs.duster.outputs.commit_sha }}

      - name: Create organization GitHub App token
        id: app-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        with:
          app-id: ${{ secrets.GH_APP_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          owner: cronxco
          repositories: claude

      - name: Checkout Claude skills
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: cronxco/claude
          token: ${{ steps.app-token.outputs.token }}
          path: claude

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: 8.4.1
          tools: composer:v2
          coverage: none

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer dependencies
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install Node Dependencies
        run: npm ci

      - name: Add Wire Credentials Loaded From ENV
        run: composer config http-basic.wire-elements-pro.composer.sh ${{ secrets.WIRE_SECRET}}

      - name: Copy Environment File
        run: cp .env.example .env

      - name: Install Dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Generate Application Key
        run: php artisan key:generate

      - name: Enable PostgreSQL Extensions
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -d laravel -c "CREATE EXTENSION IF NOT EXISTS vector;"
          PGPASSWORD=postgres psql -h localhost -U postgres -d laravel -c "CREATE EXTENSION IF NOT EXISTS postgis;"
          PGPASSWORD=postgres psql -h localhost -U postgres -d laravel -c "CREATE EXTENSION IF NOT EXISTS postgis_topology;"

      - name: Run Migrations
        run: php artisan migrate --force

      - name: Check Flint skill synchronization
        run: php artisan flint:skills-check --claude-repo=claude

      - name: Build Assets
        run: npm run build

      - name: Run Tests
        id: tests
        run: bash .github/scripts/run-tests.sh

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-reports-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/
          if-no-files-found: warn

      - name: Comment success
        if: success() && github.event_name == 'issue_comment'
        uses: peter-evans/create-or-update-comment@e8674b075228eee787fea43ef493e45ece1004c9 # v5
        with:
          issue-number: ${{ github.event.issue.number }}
          body: |
            ✅ Dust and tests passed successfully!

            **Test Results:**
            - Total: `${{ steps.tests.outputs.total }}`
            - Passed: `${{ steps.tests.outputs.passed }}`
            - Failed: `${{ steps.tests.outputs.failed }}`
            - Errors: `${{ steps.tests.outputs.errors }}`
            - Skipped: `${{ steps.tests.outputs.skipped }}`

            Triggered by comment from @${{ github.event.comment.user.login }}

      - name: Comment failure
        if: failure() && github.event_name == 'issue_comment'
        uses: peter-evans/create-or-update-comment@e8674b075228eee787fea43ef493e45ece1004c9 # v5
        with:
          issue-number: ${{ github.event.issue.number }}
          body: |
            ❌ Dust and/or tests failed!

            **Test Results:**
            - Total: `${{ steps.tests.outputs.total }}`
            - Passed: `${{ steps.tests.outputs.passed }}`
            - Failed: `${{ steps.tests.outputs.failed }}`
            - Errors: `${{ steps.tests.outputs.errors }}`
            - Skipped: `${{ steps.tests.outputs.skipped }}`

            Triggered by comment from @${{ github.event.comment.user.login }}
            Please check the [workflow run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) for details.
